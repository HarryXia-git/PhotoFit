name: Build Zippping for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run check

      - name: Build DMG and ZIP
        run: npm run build:mac -- --publish never

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: Zippping-macOS
          path: release/*
          if-no-files-found: error
          retention-days: 30
